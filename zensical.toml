        ] },
        { "Workflows" = "reference/workflow.md" },
        { "Symbol inventory" = [
            { "All symbols" = "reference/public-api.md" },
            { "Data definitions" = "reference/generated/data.md" },
            { "Model definitions" = "reference/generated/models.md" },
            { "Training definitions" = "reference/generated/training.md" },
            { "Flow definitions" = "reference/generated/flows.md" },
