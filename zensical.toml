        { "Explore a map" = "basics/explore.md" },
        { "Common questions" = "basics/faq.md" },
    ] },
    { "Advanced" = [
        "advanced/index.md",
        { "Find and analyze imagery" = [
            { "Download satellite imagery" = "advanced/download-imagery.md" },
