[project]
site_name = "GeoSave"
site_description = "Find imagery, explore maps, prepare datasets, and train geospatial models in familiar Python."
site_author = "Fatah Muria"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/stylesheets/docs.css"]
site_url = "https://weedkat.github.io/geosave-engine"

copyright = "Copyright © 2026 GeoSave contributors"

