            { "Chips and merging" = "reference/chips.md" },
            { "Dataset accessor" = "reference/dataset-accessor.md" },
            { "DataArray accessor" = "reference/dataarray-accessor.md" },
            { "DataTree accessor" = "reference/datatree-accessor.md" },
            { "Spatial and temporal targets" = "reference/region.md" },
            { "Vector accessor" = "reference/vectors.md" },
