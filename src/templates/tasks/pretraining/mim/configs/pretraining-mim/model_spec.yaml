schema_version: 1
entry: encoded
output: normalized
inputs:
  raster: {}
  value: {}

steps:
  from_raster:
    call: geosave.model.processing.validate_raster
    kwargs: {raster: !ref raster}

  prepared:
    call: modules.pretraining.mim.processing.prepare
    kwargs: {raster: !ref from_raster}

  encoded:
    call: geosave.model.processing.to_tensor
    kwargs:
      raster: !ref prepared
      dims: [time, band, y, x]
      dtype: float32

  from_tensor:
    call: modules.pretraining.mim.processing.accept_tensor
    kwargs: {value: !ref value}

  normalized:
    call: geosave.model.processing.normalize
    kwargs:
      value: !ref entry
      mean: [0.1105, 0.1355, 0.1552, 0.2743]
      std: [0.1809, 0.1757, 0.1888, 0.1742]
      dim: -3
