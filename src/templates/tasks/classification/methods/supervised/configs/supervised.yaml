seed_everything: 0
model_name: classification-supervised
trainer:
  max_epochs: 100
  log_every_n_steps: 10
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val_loss
      mode: min
      save_top_k: 1
      filename: epoch={epoch:02d}-val_loss={val_loss:.4f}
      save_last: true
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
  - class_path: lightning.pytorch.callbacks.RichProgressBar
model:
  class_path: training.module.Module
  init_args:
    model_chain:
      encoder:
        name: dinov3
        init_args:
          in_channels: 4
          input_size: 224
      head:
        name: classification
        init_args:
          num_classes: 2
    optimizer:
      class_path: torch.optim.AdamW
      init_args:
        lr: 0.001
        weight_decay: 0.01
    param_groups:
      encoder:
        lr: 0.0001
    lr_scheduler:
      class_path: torch.optim.lr_scheduler.CosineAnnealingLR
      init_args:
        T_max: 100
    lr_scheduler_config:
      interval: epoch
    criterion:
      class_path: torch.nn.CrossEntropyLoss
    metrics:
    - accuracy_macro
    - f1_macro
data:
  class_path: training.datamodule.DataModule
  init_args:
    train:
      class_path: training.datasets.MyDataset
      init_args:
        split: train
    val:
      class_path: training.datasets.MyDataset
      init_args:
        split: val
    batch_size: 8
    num_workers: 4
    augmentations:
    - name: RandomHorizontalFlip
      init_args:
        p: 0.5
    - name: RandomVerticalFlip
      init_args:
        p: 0.5
