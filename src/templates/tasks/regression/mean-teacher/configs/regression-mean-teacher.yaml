seed_everything: 0
model_name: regression-mean-teacher
trainer:
  max_epochs: 100
  log_every_n_steps: 10
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val_loss
      mode: min
      save_top_k: 1
      filename: epoch={epoch:02d}-val_loss={val_loss:.4f}
      save_last: true
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
  - class_path: lightning.pytorch.callbacks.RichProgressBar
model:
  class_path: modules.regression.mean_teacher.module.Module
  init_args:
    model_chain:
      encoder:
        name: dinov3
        init_args:
          in_channels: 4
          input_size: 224
      decoder:
        name: dpt
      head:
        name: regression
        init_args:
          variables:
          - target
    optimizer:
      name: adamw
      init_args:
        lr: 0.001
        weight_decay: 0.01
      groups:
        encoder:
          lr: 0.0001
    lr_scheduler:
      name: cosine_annealing
      init_args:
        T_max: 100
      interval: epoch
    criterion:
      class_path: torch.nn.MSELoss
    metrics:
    - mae
    - rmse
    - r2
data:
  class_path: modules.regression.mean_teacher.data.DataModule
  init_args:
    spec: configs/regression-mean-teacher/model_spec.yaml
    train:
      class_path: modules.regression.mean_teacher.datasets.MyDataset
      init_args:
        split: train
    val:
      class_path: modules.regression.mean_teacher.datasets.MyDataset
      init_args:
        split: val
    batch_size: 8
    num_workers: 4
    augmentations:
    - name: RandomHorizontalFlip
      init_args:
        p: 0.5
    - name: RandomVerticalFlip
      init_args:
        p: 0.5
    unlabeled:
      class_path: modules.regression.mean_teacher.datasets.MyUnlabeledDataset
    strong_augmentations:
    - name: RandomGaussianNoise
      init_args:
        std: 0.1
        p: 0.8
