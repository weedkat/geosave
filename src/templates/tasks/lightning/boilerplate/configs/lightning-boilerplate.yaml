seed_everything: 0
model_name: lightning-boilerplate
trainer:
  max_epochs: 100
  log_every_n_steps: 10
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
model:
  class_path: modules.lightning.boilerplate.module.Module
  init_args:
    input_size: 4
    hidden_size: 8
    learning_rate: 0.001
data:
  class_path: modules.lightning.boilerplate.data.DataModule
  init_args:
    train_size: 16
    val_size: 8
    batch_size: 4
    num_workers: 0
