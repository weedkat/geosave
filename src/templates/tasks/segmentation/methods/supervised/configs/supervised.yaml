seed_everything: 0
model_name: segmentation-supervised
trainer:
  max_epochs: 100
  limit_val_batches: 0
  log_every_n_steps: 10
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      save_top_k: 0
      save_last: true
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
  - class_path: lightning.pytorch.callbacks.RichProgressBar
model:
  class_path: training.module.Module
  init_args:
    ignore_index: 255
    model_chain:
      encoder:
        name: dinov3
        init_args:
          in_channels: 4
          input_size: 224
      decoder:
        name: dpt
      head:
        name: segmentation
        init_args:
          num_classes: 2
    optimizer:
      class_path: torch.optim.AdamW
      init_args:
        lr: 0.001
        weight_decay: 0.01
    param_groups:
      encoder:
        lr: 0.0001
    lr_scheduler:
      class_path: torch.optim.lr_scheduler.CosineAnnealingLR
      init_args:
        T_max: 100
    lr_scheduler_config:
      interval: epoch
    criterion:
      class_path: torch.nn.CrossEntropyLoss
      init_args:
        ignore_index: 255
    metrics:
    - iou_macro
    - f1_macro
data:
  class_path: training.datamodule.DataModule
  init_args:
    train:
      class_path: training.datasets.RasterDataset
      init_args:
        images: [data/train/image.tif]
        targets: [data/train/label.tif]
        preprocessor:
          class_path: processing.preprocessing.Reflectance
        num_classes: 2
        ignore_index: 255
    ignore_index: 255
    batch_size: 8
    eval_batch_size: 1
    num_workers: 4
    augmentations:
    - name: RandomHorizontalFlip
      init_args:
        p: 0.5
    - name: RandomVerticalFlip
      init_args:
        p: 0.5
