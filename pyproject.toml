[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geosave"
dynamic = ["version"]
description = 'Library for geospatial machine learning, focusing providing pretrained model, and easy mlops flows'
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "Fatah Muria", email = "fatahmurbaut@gmail.com" },
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "affine>=2.4",
    "async-geotiff>=0.5.1",
    "bokeh>=3.8",
    "colorcet>=3.1",
    "cql2>=0.5.6",
    "dask>=2026.3",
    "datashader>=0.18",
    "fsspec>=2026.3.0",
    "geopandas>=1.0.0",
    "geopy>=2.4.0",
    "geoviews>=1.15",
    "holoviews>=1.23",
    "hvplot>=0.12",
    "ipywidgets>=8.1",
    "jupyter-bokeh>=4.0",
    "matplotlib>=3.7.5",
    "netcdf4>=1.6.0",
    "numpy>=1.24.4",
    "obstore>=0.8",
    "odc-geo>=0.5.1",
    "odc-stac>=0.5.2",
    "orjson>=3.12.0",
    "pandas>=2.0.3",
    "panel>=1.9.4",
    "panel-material-ui>=0.16.2",
    "param>=2.2",
    "planetary-computer>=1.0.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.0.0",
    "pyproj>=3.6.0",
    "pystac>=1.12.0",
    "pystac-client>=0.7.6",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rasterio>=1.3.11",
    "rioxarray>=0.15.0",
    "rustac[arrow]>=0.9.17",
    "s2cloudless>=1.7.3",
    "scipy>=1.11.0",
    "shapely>=2.1",
    "spatialpandas>=0.5",
    "stac-geoparquet>=0.8.2",
    "tiler>=0.6.0",
    "tomlkit>=0.15.1",
    "typer>=0.20.1",
    "typing-extensions>=4.13.0",
    "universal-pathlib>=0.3.10",
    "urllib3>=2.6",
    "xarray>=2026.4.0",
    "zarr>=3.0.0",
]

[project.optional-dependencies]
ml = [
    "huggingface-hub>=1.0.0",
    "kornia>=0.8.2",
    "lightning>=2.3.3",
    "tensorboard>=2.14.0",
    "terratorch>=1.2.7",
    "timm>=1.0",
    "torch>=2.6",
    "torchmetrics>=1.9",
]
hub = ["geosave[ml]", "transformers>=5.17.0,<6"]
flows = ["prefect>=3.8.6"]
cloud = ["gcsfs>=2026.3.0", "s3fs>=2026.3.0"]
mlflow = ["mlflow>=2.17.2"]
all = ["geosave[ml,hub,flows,cloud,mlflow]"]

[project.urls]
Documentation = "https://github.com/weedkat/geosave#readme"
Issues = "https://github.com/weedkat/geosave/issues"
Source = "https://github.com/weedkat/geosave"

[project.scripts]
geosave = "geosave.cli.main:app"
geosave-flows = "geosave_flows.cli:app"

[project.entry-points."xarray.backends"]
geosave = "geosave.geodata.io.backend:GeoSaveBackendEntrypoint"

[tool.hatch.version]
path = "src/geosave/__about__.py"

[tool.hatch.build.targets.wheel]
# Templates are resource files copied by the CLI.
packages = ["src/geosave", "src/geosave_flows", "src/templates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib", "-m", "not slow and not integration"]
filterwarnings = [
  # torch>=2.11 deprecates LeafSpec(); Lightning 2.6 still builds it. Drop once Lightning fixes it.
  "ignore:.*isinstance\\(treespec, LeafSpec\\).*",
]
markers = [
  "slow: marks tests as slow (fresh processes, local servers, or large models); deselect by default",
  "integration: marks tests that hit external services (e.g. CDSE STAC, S3)",
]

[tool.uv]
managed = true
package = true

[tool.coverage.run]
source_pkgs = ["geosave", "geosave_flows", "tests"]
branch = true
parallel = true
omit = [
  "src/geosave/__about__.py",
]

[tool.coverage.paths]
geosave = ["src/geosave"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
  "basedpyright>=1.40.1",
  "geosave[all]",
  "ipykernel>=7.4.0",
  "ipywidgets>=8.1.8",
  "mkdocstrings[python]>=1.0.7",
  "mypy>=1.0.0",
  "nbclient>=0.11.0",
  "pre-commit>=3.8.0",
  "pytest>=8.3.5",
  "ruff>=0.15.10",
  "zensical>=0.0.2",
]
